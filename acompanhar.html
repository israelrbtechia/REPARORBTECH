<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>Acompanhe seu reparo · RB Tech Celulares</title>
  <link rel="icon" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .track { max-width: 560px; margin: 0 auto; padding: 0 16px calc(40px + var(--safe-b)); }
    .track-head { display: flex; align-items: center; gap: 12px; padding: max(16px, env(safe-area-inset-top)) 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .track-head img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; box-shadow: 0 0 24px rgba(212,175,55,.25); }
    .status-big { text-align: center; padding: 26px 18px; }
    .status-big .ic { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; }
    .status-big .ic svg.i { width: 38px; height: 38px; }
    .status-big h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
    .steps { display: flex; justify-content: space-between; position: relative; margin: 22px 4px 4px; }
    .steps::before { content: ""; position: absolute; left: 12px; right: 12px; top: 11px; height: 3px; background: var(--line-2); }
    .steps .fill { position: absolute; left: 12px; top: 11px; height: 3px; background: var(--gold-grad); transition: width .5s; }
    .step { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 25%; }
    .step .dot { width: 25px; height: 25px; border-radius: 50%; background: #1a1a1a; border: 2px solid var(--line-2); display: grid; place-items: center; }
    .step.on .dot { background: var(--gold); border-color: var(--gold); color: #000; }
    .step.cur .dot { box-shadow: 0 0 0 5px rgba(212,175,55,.25); }
    .step span { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; }
    .step.on span { color: var(--text); font-weight: 600; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div class="track" id="track">
    <div class="track-head"><img src="/assets/icon-192.png" alt="RB Tech"><div><div class="bold" style="font-size:18px">RB <span class="gold">Tech</span> Celulares</div><div class="small muted">Acompanhamento do reparo</div></div></div>
    <div class="empty" id="t-load">Carregando...</div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/js/config.js"></script>
  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/vendor/jspdf.umd.min.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/pdf.js"></script>
  <script src="/js/acompanhar.js"></script>
</body>
</html>
